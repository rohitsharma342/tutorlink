name: tutorlink
description: A bilingual mobile marketplace app connecting students and tutors

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  google_sign_in: ^6.1.5
  google_sign_in_web: ^0.12.1
  firebase_auth: ^4.15.0
  firebase_auth_web: ^5.8.9
  firebase_core: ^2.24.0
  firebase_core_web: ^2.10.0
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.4
  image_picker_for_web: ^3.0.1
  video_player: ^2.7.2
  video_player_web: ^2.1.2
  pin_code_fields: ^8.0.1
  flutter_staggered_animations: ^1.1.1
  uuid: ^4.2.1
  flutter_keyboard_visibility: ^6.0.0
  flutter_keyboard_visibility_web: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
